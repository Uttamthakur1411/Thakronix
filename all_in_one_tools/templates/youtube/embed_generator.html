<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Generator | Thakronix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/youtube/youtube-tools.css') }}">
</head>
<body>
{% include "youtube/_tool_nav.html" %}

<div class="tool-wrapper">
    <div class="container">
        <a href="{{ url_for('youtube_tools') }}" class="back-button">
            <i class="bi bi-arrow-left"></i> Back to YouTube Tools
        </a>

        <div class="tool-header">
            <h1>📱 YouTube Embed Generator</h1>
            <p>Generate custom embed codes for YouTube videos on your website</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="videoURL">YouTube Video URL</label>
                <input type="text" id="videoURL" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
            </div>

            <div class="dimension-fields">
                <div class="input-group">
                    <label for="width">Width (pixels)</label>
                    <input type="number" id="width" value="560" min="200">
                </div>
                <div class="input-group">
                    <label for="height">Height (pixels)</label>
                    <input type="number" id="height" value="315" min="200">
                </div>
            </div>

            <div class="input-group">
                <label for="embedType">Embed Type</label>
                <select id="embedType">
                    <option value="responsive">Responsive (Recommended)</option>
                    <option value="fixed">Fixed Size</option>
                    <option value="iframe">Simple iframe</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="allowFullscreen" checked>
                    Allow Fullscreen
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="showControls" checked>
                    Show Controls
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="autoplay">
                    Autoplay
                </label>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="generateEmbed()">
                    <i class="bi bi-lightning-charge"></i> Generate Embed Code
                </button>
                <button class="btn btn-secondary" onclick="clearEmbed()">
                    <i class="bi bi-arrow-clockwise"></i> Clear
                </button>
            </div>
        </div>

        <div id="resultSection" class="result-section" style="display: none;">
            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'previewTab')">Preview</button>
                <button class="tab" onclick="switchTab(event, 'htmlTab')">HTML Code</button>
                <button class="tab" onclick="switchTab(event, 'optionsTab')">Options</button>
            </div>

            <div id="previewTab" class="tab-content active">
                <div style="margin-top: 15px;">
                    <h3>Preview</h3>
                    <div style="background: #000; padding: 20px; border-radius: 8px; text-align: center;">
                        <div id="embedPreview"></div>
                    </div>
                </div>
            </div>

            <div id="htmlTab" class="tab-content">
                <div style="margin-top: 15px;">
                    <h3>Embed Code</h3>
                    <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; border-left: 4px solid #667eea; margin-bottom: 15px;">
                        <code id="embedCode" style="word-wrap: break-word; font-size: 0.85rem; white-space: pre-wrap;"></code>
                    </div>
                </div>
            </div>

            <div id="optionsTab" class="tab-content">
                <div style="margin-top: 15px;">
                    <h3>Customization Options</h3>
                    <div id="optionsDisplay"></div>
                </div>
            </div>

            <div class="button-group" style="margin-top: 20px;">
                <button class="btn btn-success" onclick="copyEmbedCode()">
                    <i class="bi bi-files"></i> Copy Code
                </button>
                <button class="btn btn-secondary" onclick="downloadEmbedCode()">
                    <i class="bi bi-download"></i> Download HTML
                </button>
            </div>
        </div>

        <div id="alertBox" style="display: none; margin-top: 20px;"></div>
    </div>
</div>

<script>
    let currentEmbedCode = '';

    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="bi bi-exclamation-circle"></i> ${message}</div>`;
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 5000);
    }

    function extractVideoID(url) {
        const patterns = [
            /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/watch\?.*v=([a-zA-Z0-9_-]{11})/,
            /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        ];

        for (let pattern of patterns) {
            const match = url.match(pattern);
            if (match) return match[1];
        }
        return null;
    }

    function generateEmbed() {
        const url = document.getElementById('videoURL').value;
        const videoID = extractVideoID(url);
        
        if (!videoID) {
            showAlert('Please enter a valid YouTube URL', 'warning');
            return;
        }

        const width = document.getElementById('width').value;
        const height = document.getElementById('height').value;
        const embedType = document.getElementById('embedType').value;
        const allowFullscreen = document.getElementById('allowFullscreen').checked;
        const showControls = document.getElementById('showControls').checked;
        const autoplay = document.getElementById('autoplay').checked;

        let embedCode = '';
        let embedParams = `?controls=${showControls ? 1 : 0}&autoplay=${autoplay ? 1 : 0}&rel=0&modestbranding=1`;
        const embedURL = `https://www.youtube-nocookie.com/embed/${videoID}${embedParams}`;

        if (embedType === 'responsive') {
            embedCode = `<div style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden;">
  <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
          src="${embedURL}" 
          title="YouTube video player" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          ${allowFullscreen ? 'allowfullscreen' : ''}>
  </iframe>
</div>`;
        } else if (embedType === 'fixed') {
            embedCode = `<iframe width="${width}" 
        height="${height}" 
        src="${embedURL}" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        ${allowFullscreen ? 'allowfullscreen' : ''}>
</iframe>`;
        } else {
            embedCode = `<iframe src="${embedURL}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>`;
        }

        currentEmbedCode = embedCode;
        document.getElementById('embedCode').textContent = embedCode;

        // Use a thumbnail preview because YouTube can block iframe playback for individual videos.
        const watchURL = `https://www.youtube.com/watch?v=${videoID}`;
        document.getElementById('embedPreview').innerHTML = `
            <div style="position: relative; width: min(100%, ${width}px); margin: 0 auto; aspect-ratio: 16 / 9; background: #111; overflow: hidden;">
                <img src="https://i.ytimg.com/vi/${videoID}/hqdefault.jpg" alt="YouTube video thumbnail" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                <a href="${watchURL}" target="_blank" rel="noopener noreferrer" style="position: absolute; inset: 0; display: grid; place-items: center; text-decoration: none; background: rgba(0,0,0,.18);">
                    <span style="display: grid; place-items: center; width: 72px; height: 50px; border-radius: 14px; background: #ff0033; color: white; font-size: 1.7rem; box-shadow: 0 5px 20px rgba(0,0,0,.35);">▶</span>
                </a>
            </div>
            <div style="margin-top: 10px; color: #666; font-size: .9rem;">Preview thumbnail. Open on YouTube if embedding is disabled for this video.</div>
        `;

        // Options display
        const optionsHtml = `
            <div class="card">
                <div><strong>Video ID:</strong> <code>${videoID}</code></div>
            </div>
            <div class="card">
                <div><strong>Dimensions:</strong> ${width}×${height}px</div>
            </div>
            <div class="card">
                <div><strong>Type:</strong> ${embedType === 'responsive' ? 'Responsive (Recommended for mobile)' : embedType === 'fixed' ? 'Fixed Size' : 'Simple iframe'}</div>
            </div>
            <div class="card">
                <div>
                    <strong>Features:</strong><br>
                    - Fullscreen: ${allowFullscreen ? '✓ Enabled' : '✗ Disabled'}<br>
                    - Controls: ${showControls ? '✓ Enabled' : '✗ Disabled'}<br>
                    - Autoplay: ${autoplay ? '✓ Enabled' : '✗ Disabled'}
                </div>
            </div>
        `;
        document.getElementById('optionsDisplay').innerHTML = optionsHtml;

        document.getElementById('resultSection').style.display = 'block';
        showAlert('Embed code generated!', 'success');
    }

    function copyEmbedCode() {
        navigator.clipboard.writeText(currentEmbedCode).then(() => {
            showAlert('Embed code copied!', 'success');
        });
    }

    function downloadEmbedCode() {
        const html = `<!DOCTYPE html>
<html>
<head>
    <title>YouTube Embed</title>
</head>
<body>
${currentEmbedCode}
</body>
</html>`;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'youtube-embed.html';
        a.click();
        showAlert('HTML file downloaded!', 'success');
    }

    function switchTab(event, tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    function clearEmbed() {
        document.getElementById('videoURL').value = '';
        document.getElementById('width').value = '560';
        document.getElementById('height').value = '315';
        document.getElementById('resultSection').style.display = 'none';
        currentEmbedCode = '';
    }
</script>

</body>
</html>
