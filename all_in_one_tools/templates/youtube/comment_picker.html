<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Comment Picker | Thakronix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/youtube/youtube-tools.css') }}">
</head>
<body>
{% include "youtube/_tool_nav.html" %}

<div class="tool-wrapper">
    <div class="container">
        <a href="{{ url_for('youtube_tools') }}" class="back-button">
            <i class="bi bi-arrow-left"></i> Back to YouTube Tools
        </a>

        <div class="tool-header">
            <h1>🎲 YouTube Comment Picker</h1>
            <p>Pick random winners from video comments for giveaways</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="commentsText">Paste Comments (one per line)</label>
                <textarea id="commentsText" placeholder="Paste comments here - one comment per line with author name"></textarea>
            </div>

            <div class="input-group">
                <label for="winnerCount">Number of Winners</label>
                <input type="number" id="winnerCount" min="1" max="100" value="1">
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label style="display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="removeDuplicates" checked> Remove duplicate users
                </label>
                <label style="display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="onePerUser" checked> One winner per user
                </label>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="pickWinner()">
                    <i class="bi bi-lightning-charge"></i> Pick Winner
                </button>
                <button class="btn btn-secondary" onclick="clearComments()">
                    <i class="bi bi-arrow-clockwise"></i> Clear
                </button>
            </div>
        </div>

        <div id="winnerSection" class="result-section" style="display: none;">
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 20px;">
                <h2 style="color: white; margin-bottom: 20px;">🎉 WINNER!</h2>
                <div class="meta-item" style="background: none; border: 3px solid white; color: white;">
                    <div class="meta-label" style="font-size: 1.2rem;">Winner Name</div>
                    <div class="meta-value" id="winnerName" style="font-size: 2rem;">-</div>
                </div>
            </div>

            <div id="winnersList"></div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="pickWinner()">
                    <i class="bi bi-shuffle"></i> Pick Another
                </button>
                <button class="btn btn-success" onclick="downloadWinners()">
                    <i class="bi bi-download"></i> Download Winners
                </button>
            </div>
        </div>

        <div id="alertBox" style="display: none; margin-top: 20px;"></div>
    </div>
</div>

<script>
    let winners = [];
    let allComments = [];

    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="bi bi-exclamation-circle"></i> ${message}</div>`;
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 5000);
    }

    function pickWinner() {
        const commentsText = document.getElementById('commentsText').value;
        const winnerCount = parseInt(document.getElementById('winnerCount').value);

        if (!commentsText.trim()) {
            showAlert('Please paste some comments', 'warning');
            return;
        }

        allComments = commentsText.trim().split('\n').filter(c => c.trim().length > 0);
        const comments = [...allComments];

        if (comments.length < winnerCount) {
            showAlert('Not enough comments for the number of winners selected', 'warning');
            return;
        }

        winners = [];
        for (let i = 0; i < winnerCount; i++) {
            const index = Math.floor(Math.random() * comments.length);
            winners.push(comments[index]);
            comments.splice(index, 1);
        }

        displayWinners();
        document.getElementById('winnerSection').style.display = 'block';
        showAlert('Winner(s) selected! 🎉', 'success');
    }

    function displayWinners() {
        document.getElementById('winnerName').textContent = winners[0] || '-';
        
        const winnersHtml = winners.map((winner, idx) => `
            <div class="card">
                <strong>Winner #${idx + 1}</strong>: ${winner}
            </div>
        `).join('');
        
        document.getElementById('winnersList').innerHTML = winnersHtml;
    }

    function downloadWinners() {
        let text = 'YouTube Comment Picker - Winners List\n\n';
        winners.forEach((w, i) => text += `${i + 1}. ${w}\n`);
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'winners.txt';
        a.click();
    }

    function clearComments() {
        document.getElementById('commentsText').value = '';
        document.getElementById('winnerSection').style.display = 'none';
        winners = [];
    }
</script>

</body>
</html>
