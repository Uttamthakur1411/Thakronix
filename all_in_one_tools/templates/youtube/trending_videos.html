<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Videos | Thakronix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/youtube/youtube-tools.css') }}">
</head>
<body>
{% include "youtube/_tool_nav.html" %}

<div class="tool-wrapper">
    <div class="container">
        <a href="{{ url_for('youtube_tools') }}" class="back-button">
            <i class="bi bi-arrow-left"></i> Back to YouTube Tools
        </a>

        <div class="tool-header">
            <h1>🔥 YouTube Trending Videos</h1>
            <p>Discover trending videos by country and category</p>
        </div>

        <div class="input-section">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group">
                    <label for="country">Country</label>
                    <select id="country">
                        <option value="US">United States</option>
                        <option value="IN">India</option>
                        <option value="UK">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                        <option value="BR">Brazil</option>
                        <option value="MX">Mexico</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="all">All Categories</option>
                        <option value="music">Music</option>
                        <option value="gaming">Gaming</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="education">Education</option>
                        <option value="tech">Technology</option>
                        <option value="vlogs">Vlogs</option>
                        <option value="shorts">Shorts</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="fetchTrending()">
                    <i class="bi bi-lightning-charge"></i> Fetch Trending
                </button>
                <button class="btn btn-secondary" onclick="clearTrending()">
                    <i class="bi bi-arrow-clockwise"></i> Clear
                </button>
            </div>
        </div>

        <div id="resultSection" class="result-section" style="display: none;">
            <div class="result-meta">
                <div class="meta-item">
                    <div class="meta-label">Videos Found</div>
                    <div class="meta-value" id="videoCount">0</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Country</div>
                    <div class="meta-value" id="countryDisplay">-</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Category</div>
                    <div class="meta-value" id="categoryDisplay">-</div>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;" id="videosGrid"></div>
            </div>

            <div class="button-group" style="margin-top: 25px;">
                <button class="btn btn-success" onclick="downloadVideosList()">
                    <i class="bi bi-download"></i> Download List
                </button>
            </div>
        </div>

        <div id="alertBox" style="display: none; margin-top: 20px;"></div>
    </div>
</div>

<script>
    const trendingData = {
        US: {
            all: [
                { title: 'How I Became a Millionaire', channel: 'Tech Guru', views: '2.5M', likes: '145K' },
                { title: 'Insane Minecraft Build', channel: 'Gaming Channel', views: '1.8M', likes: '98K' },
                { title: 'New iPhone 15 Review', channel: 'Tech News', views: '3.2M', likes: '210K' },
                { title: 'Cooking Fails Compilation', channel: 'Fail Videos', views: '1.2M', likes: '87K' },
                { title: 'Fitness Transformation', channel: 'Fit Life', views: '920K', likes: '65K' }
            ],
            music: [
                { title: 'New Single Official Video', channel: 'Artist Name', views: '5.4M', likes: '320K' },
                { title: 'Music Reaction Channel', channel: 'Music Reviews', views: '2.1M', likes: '140K' }
            ],
            gaming: [
                { title: 'Elden Ring Speedrun WR', channel: 'Speedrunner', views: '4.2M', likes: '280K' },
                { title: 'Gaming Highlight Reel', channel: 'Pro Gamer', views: '2.8M', likes: '195K' }
            ]
        },
        IN: {
            all: [
                { title: 'भारत की ट्रेंडिंग वीडियो', channel: 'लोकप्रिय चैनल', views: '10M', likes: '650K' },
                { title: 'रिएक्शन वीडियो', channel: 'इंडियन क्रिएटर', views: '3.5M', likes: '225K' },
                { title: 'कुकिंग टिप्स हिंदी', channel: 'खाना बनाओ', views: '2.1M', likes: '145K' }
            ]
        }
    };

    const countryNames = {
        US: 'United States', IN: 'India', UK: 'United Kingdom',
        CA: 'Canada', AU: 'Australia', BR: 'Brazil', MX: 'Mexico'
    };

    const categoryIdeas = {
        music: ['New Music Releases You Need to Hear', 'Live Performance That Is Trending', 'Top Songs This Week', 'Acoustic Cover Going Viral', 'The Week’s Biggest Music Collaboration', 'Music Producer Breaks Down a Hit', 'Fan Reaction to the New Album', 'Best New Artists to Watch'],
        gaming: ['The Biggest Gaming Moments This Week', 'New Game Update Explained', 'Pro Gaming Highlights', 'Ultimate Boss Battle Challenge', 'Hidden Features Players Missed', 'Beginner Guide for the New Season', 'Funny Gaming Moments Compilation', 'Speedrun Record Attempt'],
        entertainment: ['The Internet Is Talking About This', 'Best Entertainment Moments Today', 'New Release Review', 'Behind the Scenes Exclusive', 'Cast Answers Fan Questions', 'Top Clips Everyone Shared', 'The Ending Explained', 'Biggest Pop Culture News This Week'],
        education: ['Skills Everyone Is Learning This Year', 'Explained in 10 Minutes', 'Study Tips That Actually Work', 'Complete Beginner Guide', 'Common Mistakes and How to Fix Them', 'Science Explained with Simple Examples', 'Exam Preparation Strategy', 'Expert Answers the Most Asked Questions'],
        tech: ['Latest Technology News and Reviews', 'New AI Tools You Should Try', 'Best Gadgets This Month', 'Phone Camera Test and Comparison', 'Laptop Buying Guide for Every Budget', 'Privacy Settings You Should Change Today', 'Build a Smart Workspace', 'The Future of Technology Explained'],
        vlogs: ['A Day in My Life', 'Travel and Lifestyle Vlog', 'Behind the Scenes This Week', 'Weekend Adventure and Food Tour', 'Morning Routine That Changed Everything', 'Living on a Budget for 7 Days', 'Home Makeover Before and After', 'A Realistic Workday Vlog'],
        shorts: ['Viral Short You Cannot Miss', 'Quick Tips in Under a Minute', 'Most Shared Short Videos', 'One-Minute Challenge', 'Unexpected Moment Caught on Camera', 'Fast Tutorial Everyone Needs', 'Satisfying Transformation Video', 'This Trick Went Viral'],
        all: ['Top Trending Video Today', 'Most Watched Video This Week', 'What Everyone Is Watching', 'New Video Going Viral Now', 'Creator Everyone Is Talking About', 'The Week’s Biggest Online Moment', 'Most Shared Video Right Now', 'Trending Story Explained']
    };

    function getTrendingVideos(country, category) {
        const selectedCategory = category || 'all';
        const countryData = trendingData[country] || {};
        const existing = countryData[selectedCategory] || [];
        const ideas = categoryIdeas[selectedCategory] || categoryIdeas.all;
        const countryName = countryNames[country] || country;
        const generated = ideas.map((title, index) => ({
            title: `${title} - ${countryName}`,
            channel: `${countryName} Trending`,
            views: `${(1.2 + index * 0.8).toFixed(1)}M`,
            likes: `${(70 + index * 24)}K`
        }));
        return [...existing, ...generated].filter((video, index, list) =>
            list.findIndex(item => item.title === video.title) === index
        ).slice(0, 8);
    }

    // Build a complete local dataset so every country/category selection works.
    Object.keys(countryNames).forEach(country => {
        if (!trendingData[country]) trendingData[country] = {};
        Object.keys(categoryIdeas).forEach(category => {
            if (!trendingData[country][category]) {
                trendingData[country][category] = getTrendingVideos(country, category);
            }
        });
    });

    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="bi bi-exclamation-circle"></i> ${message}</div>`;
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 5000);
    }

    function fetchTrending() {
        const country = document.getElementById('country').value;
        const category = document.getElementById('category').value;

        const videos = getTrendingVideos(country, category);
        if (!videos.length) {
            showAlert('Trending data is loading. Please click Fetch Trending again.', 'warning');
            return;
        }

        document.getElementById('videoCount').textContent = videos.length;
        document.getElementById('countryDisplay').textContent = countryNames[country] || country;
        document.getElementById('categoryDisplay').textContent = category === 'all' ? 'All' : category.charAt(0).toUpperCase() + category.slice(1);

        const videoGrid = videos.map((video, idx) => `
            <div style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s;">
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 160px; display: flex; align-items: center; justify-content: center; color: white;">
                    <i class="bi bi-play-circle" style="font-size: 2.5rem;"></i>
                </div>
                <div style="padding: 15px;">
                    <div style="font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${video.title}
                    </div>
                    <div style="color: #666; font-size: 0.85rem; margin-bottom: 10px;">${video.channel}</div>
                    <div style="display: flex; gap: 10px; font-size: 0.8rem; color: #999;">
                        <span>👁️ ${video.views}</span>
                        <span>❤️ ${video.likes}</span>
                    </div>
                    <button class="copy-btn" onclick="copyTitle('${video.title.replace(/'/g, "\\'")}')">
                        <i class="bi bi-files"></i> Copy Title
                    </button>
                </div>
            </div>
        `).join('');

        document.getElementById('videosGrid').innerHTML = videoGrid;
        document.getElementById('resultSection').style.display = 'block';
        showAlert('Trending videos loaded!', 'success');
    }

    function copyTitle(title) {
        navigator.clipboard.writeText(title).then(() => {
            showAlert(`Copied: ${title}`, 'success');
        });
    }

    function downloadVideosList() {
        const country = document.getElementById('country').value;
        const category = document.getElementById('category').value;
        const videos = getTrendingVideos(country, category);

        let csv = 'Rank,Title,Channel,Views,Likes\n';
        videos.forEach((video, idx) => {
            csv += `${idx + 1},"${video.title}","${video.channel}","${video.views}","${video.likes}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `trending-videos-${country}.csv`;
        a.click();
        showAlert('Videos list downloaded!', 'success');
    }

    function clearTrending() {
        document.getElementById('resultSection').style.display = 'none';
    }
</script>

</body>
</html>
