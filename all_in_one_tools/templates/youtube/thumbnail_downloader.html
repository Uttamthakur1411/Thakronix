<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Downloader | Thakronix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/youtube/youtube-tools.css') }}">
</head>
<body>
{% include "youtube/_tool_nav.html" %}

<div class="tool-wrapper">
    <div class="container">
        <a href="{{ url_for('youtube_tools') }}" class="back-button">
            <i class="bi bi-arrow-left"></i> Back to YouTube Tools
        </a>

        <div class="tool-header">
            <h1>🖼️ YouTube Thumbnail Downloader</h1>
            <p>Download YouTube video thumbnails in multiple resolutions</p>
        </div>

        <!-- INPUT SECTION -->
        <div class="input-section">
            <div class="input-group">
                <label for="youtubeUrl">
                    <i class="bi bi-link-45deg"></i> YouTube Video URL
                </label>
                <input 
                    type="text" 
                    id="youtubeUrl" 
                    placeholder="Paste YouTube URL"
                >
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="getThumbnails()">
                    <i class="bi bi-lightning-charge"></i> Get Thumbnails
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <i class="bi bi-arrow-clockwise"></i> Clear
                </button>
            </div>
        </div>

        <!-- RESULT SECTION -->
        <div id="resultSection" class="result-section" style="display: none;">
            
            <div class="result-meta" style="margin-bottom: 30px;">
                <div class="meta-item">
                    <div class="meta-label">Video ID</div>
                    <div class="meta-value" id="videoId" style="font-size: 1rem;">-</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Resolutions</div>
                    <div class="meta-value">4</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Format</div>
                    <div class="meta-value">JPG</div>
                </div>
            </div>

            <!-- THUMBNAILS GRID -->
            <div id="thumbnailsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px;"></div>

        </div>

        <!-- ERROR ALERT -->
        <div id="alertBox" style="display: none; margin-top: 20px;"></div>

    </div>
</div>

<script>
    const thumbnails = [
        { name: 'Max Resolution (1280×720)', url: 'https://img.youtube.com/vi/{videoId}/maxresdefault.jpg', size: '1280×720' },
        { name: 'High Quality (480×360)', url: 'https://img.youtube.com/vi/{videoId}/hqdefault.jpg', size: '480×360' },
        { name: 'Medium Quality (320×180)', url: 'https://img.youtube.com/vi/{videoId}/mqdefault.jpg', size: '320×180' },
        { name: 'Standard (120×90)', url: 'https://img.youtube.com/vi/{videoId}/default.jpg', size: '120×90' },
    ];

    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `
            <div class="alert alert-${type}">
                <i class="bi bi-exclamation-circle"></i> ${message}
            </div>
        `;
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 5000);
    }

    function extractVideoId(url) {
        const patterns = [
            /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/watch\?.*v=([a-zA-Z0-9_-]{11})/,
            /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        ];

        for (let pattern of patterns) {
            const match = url.match(pattern);
            if (match) return match[1];
        }
        return null;
    }

    function getThumbnails() {
        const url = document.getElementById('youtubeUrl').value.trim();

        if (!url) {
            showAlert('Please enter a YouTube URL', 'warning');
            return;
        }

        const videoId = extractVideoId(url);
        if (!videoId) {
            showAlert('Invalid YouTube URL', 'error');
            return;
        }

        document.getElementById('videoId').textContent = videoId;

        const html = thumbnails.map(thumb => `
            <div class="card" style="text-align: center;">
                <div style="background: #f0f0f0; border-radius: 8px; overflow: hidden; margin-bottom: 15px;">
                    <img src="${thumb.url.replace('{videoId}', videoId)}" alt="${thumb.name}" style="max-width: 100%; height: auto; border-radius: 8px;" loading="lazy">
                </div>
                <h4 style="font-size: 1rem; margin-bottom: 10px;">${thumb.name}</h4>
                <p style="color: #666; margin-bottom: 15px; font-size: 0.9rem;">${thumb.size}</p>
                <div class="button-group" style="gap: 10px;">
                    <button class="btn btn-success" style="flex: 1; font-size: 0.9rem;" onclick="downloadThumbnail('${thumb.url.replace('{videoId}', videoId)}', '${videoId}')">
                        <i class="bi bi-download"></i> Download
                    </button>
                    <button class="btn btn-secondary" style="flex: 1; font-size: 0.9rem;" onclick="copyUrl('${thumb.url.replace('{videoId}', videoId)}')">
                        <i class="bi bi-files"></i> Copy URL
                    </button>
                </div>
            </div>
        `).join('');

        document.getElementById('thumbnailsContainer').innerHTML = html;
        document.getElementById('resultSection').style.display = 'block';
        showAlert('Thumbnails loaded successfully!', 'success');
    }

    function downloadThumbnail(url, videoId) {
        fetch(url)
            .then(response => response.blob())
            .then(blob => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `youtube-thumbnail-${videoId}.jpg`;
                a.click();
                URL.revokeObjectURL(a.href);
                showAlert('Thumbnail downloaded!', 'success');
            })
            .catch(err => {
                showAlert('Failed to download thumbnail', 'error');
                console.error(err);
            });
    }

    function copyUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            showAlert('URL copied to clipboard!', 'success');
        });
    }

    function clearAll() {
        document.getElementById('youtubeUrl').value = '';
        document.getElementById('resultSection').style.display = 'none';
    }
</script>

</body>
</html>
