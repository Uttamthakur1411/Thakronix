<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Idea Generator | Thakronix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/youtube/youtube-tools.css') }}">
</head>
<body>
{% include "youtube/_tool_nav.html" %}

<div class="tool-wrapper">
    <div class="container">
        <a href="{{ url_for('youtube_tools') }}" class="back-button">
            <i class="bi bi-arrow-left"></i> Back to YouTube Tools
        </a>

        <div class="tool-header">
            <h1>💡 YouTube Content Idea Generator</h1>
            <p>Generate trending video ideas for your YouTube channel</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="niche">Channel Niche</label>
                <select id="niche">
                    <option value="">Select your niche...</option>
                    <option value="tech">Technology</option>
                    <option value="education">Education</option>
                    <option value="lifestyle">Lifestyle</option>
                    <option value="business">Business</option>
                    <option value="gaming">Gaming</option>
                    <option value="fitness">Fitness & Health</option>
                    <option value="cooking">Cooking</option>
                    <option value="travel">Travel</option>
                    <option value="music">Music</option>
                    <option value="vlog">Daily Vlogs</option>
                </select>
            </div>

            <div class="input-group">
                <label for="targetAudience">Target Audience</label>
                <select id="targetAudience">
                    <option value="beginners">Beginners</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                    <option value="mixed">All Levels</option>
                </select>
            </div>

            <div class="input-group">
                <label for="contentCount">Number of Ideas</label>
                <select id="contentCount">
                    <option value="5">5 Ideas</option>
                    <option value="10" selected>10 Ideas</option>
                    <option value="20">20 Ideas</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="generateIdeas()">
                    <i class="bi bi-lightning-charge"></i> Generate Ideas
                </button>
                <button class="btn btn-secondary" onclick="clearIdeas()">
                    <i class="bi bi-arrow-clockwise"></i> Clear
                </button>
            </div>
        </div>

        <div id="resultSection" class="result-section" style="display: none;">
            <div class="result-meta">
                <div class="meta-item">
                    <div class="meta-label">Ideas Generated</div>
                    <div class="meta-value" id="ideaCount">0</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Trending Topics</div>
                    <div class="meta-value" id="trendingCount">0</div>
                </div>
                <div class="meta-item">
                    <div class="meta-label">Niche</div>
                    <div class="meta-value" id="nicheDisplay">-</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'allIdeasTab')">All Ideas</button>
                <button class="tab" onclick="switchTab(event, 'trendingTab')">Trending</button>
                <button class="tab" onclick="switchTab(event, 'evergreenTab')">Evergreen</button>
            </div>

            <div id="allIdeasTab" class="tab-content active">
                <div id="allIdeasContainer"></div>
            </div>

            <div id="trendingTab" class="tab-content">
                <div id="trendingContainer"></div>
            </div>

            <div id="evergreenTab" class="tab-content">
                <div id="evergreenContainer"></div>
            </div>

            <div class="button-group" style="margin-top: 20px;">
                <button class="btn btn-success" onclick="copyAllIdeas()">
                    <i class="bi bi-files"></i> Copy All Ideas
                </button>
                <button class="btn btn-secondary" onclick="downloadIdeas()">
                    <i class="bi bi-download"></i> Download CSV
                </button>
            </div>
        </div>

        <div id="alertBox" style="display: none; margin-top: 20px;"></div>
    </div>
</div>

<script>
    const ideaLibrary = {
        tech: {
            trending: [
                '🤖 AI Tools That Will Replace Your Job in 2024',
                '⚡ 5 Hidden Features in ChatGPT Nobody Knows',
                '🔒 Is Your Data Safe? Cybersecurity Secrets Revealed',
                '📱 New iPhone Features Explained (Deep Dive)',
                '🖥️ Building a Gaming PC on $1000 Budget',
            ],
            evergreen: [
                '🐍 Complete Python Course for Beginners',
                '🌐 How to Build Your First Website',
                '💻 Best Coding Languages to Learn in 2024',
                '🔧 Essential Tools Every Developer Needs',
                '📚 Learning Programming: The Right Way',
            ]
        },
        education: {
            trending: [
                '📊 2024 College Application Hacks',
                '✏️ STEM Education Revolution',
                '🎓 Most In-Demand Skills Right Now',
                '📖 Online Learning: What Actually Works',
                '🏆 Study Hacks That Actually Boost Your Grades',
            ],
            evergreen: [
                '🎯 Time Management for Students',
                '📝 How to Take Better Notes',
                '💡 Critical Thinking Skills Explained',
                '🧠 How to Remember Everything You Study',
                '📚 Building a Successful Study Routine',
            ]
        },
        fitness: {
            trending: [
                '💪 The Protein Myth: What Fitness Industry Doesn\'t Tell You',
                '⚡ 30-Minute Home Workouts (No Equipment)',
                '🥗 Meal Prep Hacks for Busy People',
                '🏃 Running for Weight Loss: The Truth',
                '🧘 Mental Health & Fitness Connection',
            ],
            evergreen: [
                '🏋️ Beginner Weightlifting Guide',
                '💪 Best Exercises for Each Muscle Group',
                '🥇 Fitness Motivation Strategies',
                '📊 Tracking Your Fitness Progress',
                '🎯 Setting Realistic Fitness Goals',
            ]
        },
        lifestyle: {
            trending: [
                '🌍 Sustainable Living Hacks 2024',
                '💰 Passive Income Ideas You Didn\'t Know',
                '🧘 Digital Detox Challenge',
                '🏠 Minimalism: Life Changing Tips',
                '✨ Self-Care Routine Secrets',
            ],
            evergreen: [
                '🎯 Goal Setting That Actually Works',
                '💼 Work-Life Balance Strategy',
                '🌟 Building Confidence Tips',
                '📱 Social Media Detox Guide',
                '🎨 Finding Your Life\'s Purpose',
            ]
        }
    };

    function showAlert(message, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = `<div class="alert alert-${type}"><i class="bi bi-exclamation-circle"></i> ${message}</div>`;
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 5000);
    }

    function generateIdeas() {
        const niche = document.getElementById('niche').value;
        const count = parseInt(document.getElementById('contentCount').value);

        if (!niche) {
            showAlert('Please select a niche', 'warning');
            return;
        }

        const library = ideaLibrary[niche] || ideaLibrary.tech;
        const allIdeas = [...library.trending, ...library.evergreen];
        const selectedIdeas = allIdeas.slice(0, count);
        const trending = library.trending.slice(0, Math.ceil(count / 2));
        const evergreen = library.evergreen.slice(0, Math.floor(count / 2));

        document.getElementById('ideaCount').textContent = selectedIdeas.length;
        document.getElementById('trendingCount').textContent = trending.length;
        document.getElementById('nicheDisplay').textContent = niche.charAt(0).toUpperCase() + niche.slice(1);

        // All Ideas
        const allHtml = selectedIdeas.map((idea, idx) => `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
                    <div>
                        <div style="font-weight: 600; margin-bottom: 5px;">#${idx + 1}</div>
                        <div>${idea}</div>
                    </div>
                    <button class="copy-btn" onclick="copyIdea('${idea.replace(/'/g, "\\'")}')">
                        <i class="bi bi-files"></i> Copy
                    </button>
                </div>
            </div>
        `).join('');

        // Trending
        const trendingHtml = trending.map((idea, idx) => `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
                    <div>
                        <div style="font-weight: 600; margin-bottom: 5px;">🔥 Trending #${idx + 1}</div>
                        <div>${idea}</div>
                    </div>
                    <button class="copy-btn" onclick="copyIdea('${idea.replace(/'/g, "\\'")}')">
                        <i class="bi bi-files"></i> Copy
                    </button>
                </div>
            </div>
        `).join('');

        // Evergreen
        const evergreenHtml = evergreen.map((idea, idx) => `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
                    <div>
                        <div style="font-weight: 600; margin-bottom: 5px;">⭐ Evergreen #${idx + 1}</div>
                        <div>${idea}</div>
                    </div>
                    <button class="copy-btn" onclick="copyIdea('${idea.replace(/'/g, "\\'")}')">
                        <i class="bi bi-files"></i> Copy
                    </button>
                </div>
            </div>
        `).join('');

        document.getElementById('allIdeasContainer').innerHTML = allHtml;
        document.getElementById('trendingContainer').innerHTML = trendingHtml;
        document.getElementById('evergreenContainer').innerHTML = evergreenHtml;

        document.getElementById('resultSection').style.display = 'block';
        showAlert('Ideas generated!', 'success');
    }

    function copyIdea(idea) {
        navigator.clipboard.writeText(idea).then(() => {
            showAlert(`Copied: ${idea.substring(0, 50)}...`, 'success');
        });
    }

    function copyAllIdeas() {
        const ideas = Array.from(document.querySelectorAll('#allIdeasContainer .card')).map(card => {
            return card.textContent.trim().split('\n')[1] || card.textContent.trim();
        }).join('\n');

        navigator.clipboard.writeText(ideas).then(() => {
            showAlert('All ideas copied!', 'success');
        });
    }

    function downloadIdeas() {
        const niche = document.getElementById('niche').value;
        let csv = 'Title,Type,Category\n';
        
        Array.from(document.querySelectorAll('#allIdeasContainer .card')).forEach((card, idx) => {
            const idea = card.textContent.trim().split('\n')[1] || card.textContent.trim();
            csv += `"${idea}","Video","${niche}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'video-ideas.csv';
        a.click();
        showAlert('Ideas downloaded!', 'success');
    }

    function switchTab(event, tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    function clearIdeas() {
        document.getElementById('niche').value = '';
        document.getElementById('resultSection').style.display = 'none';
    }
</script>

</body>
</html>
