<section class="security-panel" data-security-panel="file-integrity"><div class="security-grid"><div class="security-card"><div class="card-head"><div><span class="eyebrow">LOCAL FILE FORENSICS</span><h3>File Integrity Checker</h3></div><span class="shield">#</span></div><div class="dropzone" id="hashDrop"><input type="file" id="hashFiles" multiple><strong>Drop one or two files or browse</strong><small>Hashes are computed locally in your browser.</small></div><div id="hashResult" class="tool-result"></div><div class="search-row"><input id="hashExpected" placeholder="Optional SHA-256 comparison value"><button class="outline-btn" id="hashCompare">Compare</button></div><button class="outline-btn" id="hashExport">Export hash report</button></div><div class="security-card"><h3>Algorithms</h3><div class="quick-checks"><span>MD5</span><span>SHA-1</span><span>SHA-256</span><span>SHA-512</span></div><p class="security-note">Hash comparison indicates byte-level equality. It does not prove a file is safe.</p></div></div></section>
