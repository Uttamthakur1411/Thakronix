<section class="security-panel" data-security-panel="password-generator"><div class="security-grid"><div class="security-card"><div class="card-head"><div><span class="eyebrow">LOCAL GENERATION</span><h3>Password Security Studio</h3></div><span class="shield">✦</span></div><div class="mode-tabs"><button class="mode-tab active" data-generator-mode="random">Random</button><button class="mode-tab" data-generator-mode="passphrase">Passphrase</button><button class="mode-tab" data-generator-mode="pin">PIN</button><button class="mode-tab" data-generator-mode="token">API token</button></div><div class="generator-options"><label>Length <input type="number" id="passwordLength" min="4" max="256" value="24"></label><label>How many <input type="number" id="passwordCount" min="1" max="20" value="3"></label><label class="check-row"><input type="checkbox" id="useUpper" checked> Uppercase</label><label class="check-row"><input type="checkbox" id="useLower" checked> Lowercase</label><label class="check-row"><input type="checkbox" id="useNumbers" checked> Numbers</label><label class="check-row"><input type="checkbox" id="useSymbols" checked> Symbols</label><label class="check-row"><input type="checkbox" id="excludeAmbiguous"> Exclude ambiguous</label></div><button class="primary-btn wide" id="generatePasswords">Generate locally <span>↻</span></button></div><div class="security-card"><div class="card-head"><h3>Password recipe</h3><span id="generatorEntropy">CSPRNG</span></div><div id="passwordResults" class="password-results"></div><p id="recipeExplanation" class="security-note">Generated with the browser's cryptographically secure random source. Nothing is sent to the server.</p></div></div></section>
