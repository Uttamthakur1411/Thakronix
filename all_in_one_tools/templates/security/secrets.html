<section class="security-panel" data-security-panel="secrets"><div class="security-card"><div class="card-head"><div><span class="eyebrow">LOCAL CODE SCAN</span><h3>Secret / API Key Scanner</h3></div><span class="shield">⌕</span></div><textarea id="secretInput" class="code-area" placeholder="Paste code, .env text, logs or configuration"></textarea><div class="search-row"><input type="file" id="secretFile" accept=".txt,.env,.js,.ts,.py,.json,.yml,.yaml"><button class="primary-btn" id="secretScan">Scan locally</button></div><div id="secretResult" class="tool-result empty-state">Detects common token shapes, private-key blocks, .env secrets and line numbers. Nothing is uploaded.</div></div></section>
