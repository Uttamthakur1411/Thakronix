<section class="tool-panel" data-panel="discount"><div class="panel-grid"><div class="input-card"><h3>Shopping price calculator</h3><div class="flow-label">ORIGINAL PRICE <span>↓</span> DISCOUNT <span>↓</span> COUPON <span>↓</span> GST + SHIPPING</div><div class="field-grid"><label>Original price<input type="number" id="priceOriginal" value="1499" min="0"></label><label>Discount %<input type="number" id="priceDiscount" value="25" min="0" max="100"></label><label>Coupon amount<input type="number" id="priceCoupon" value="0" min="0"></label><label>GST %<input type="number" id="priceGst" value="0" min="0"></label><label>Shipping<input type="number" id="priceShipping" value="0" min="0"></label><label>Cashback<input type="number" id="priceCashback" value="0" min="0"></label></div><button class="primary-btn wide" id="discountCalculate">Calculate final price <span>→</span></button></div><div class="result-card accent-pink"><span class="result-label">YOU PAY</span><strong id="priceFinal">₹0.00</strong><div class="result-sub" id="priceSaved">You save ₹0.00</div></div></div><div class="two-col"><div class="info-card"><h3>Price breakdown</h3><div class="profile-list"><p><span>After discount</span><b id="priceAfterDiscount">—</b></p><p><span>After coupon</span><b id="priceAfterCoupon">—</b></p><p><span>GST</span><b id="priceTax">—</b></p><p><span>Effective saving</span><b id="priceSavingPct">—</b></p></div></div><div class="info-card"><h3>Sale price reverse</h3><p class="muted">Selling price and discount reveal the original price.</p><div class="field-grid"><label>Sale price<input type="number" id="reverseSale" value="1499"></label><label>Discount %<input type="number" id="reverseDiscount" value="25"></label></div><div class="mini-result" id="reverseResult">Original price: —</div></div></div></section>
