<section class="tool-panel" data-panel="bmi"><div class="panel-grid"><div class="input-card"><h3>Body metrics <span class="unit-switch"><button class="selected" data-unit="metric">Metric</button><button data-unit="imperial">Imperial</button></span></h3><div class="field-grid"><label>Height <input type="number" id="bmiHeight" value="170" min="1"><small id="heightUnit">cm</small></label><label>Weight <input type="number" id="bmiWeight" value="70" min="1"><small id="weightUnit">kg</small></label><label>Age <input type="number" id="bmiAge" value="30" min="1"></label><label>Sex<select id="bmiSex"><option value="male">Male</option><option value="female">Female</option></select></label><label>Activity<select id="bmiActivity"><option value="1.2">Sedentary</option><option value="1.375">Lightly active</option><option value="1.55" selected>Moderately active</option><option value="1.725">Very active</option></select></label></div><button class="primary-btn wide" id="bmiCalculate">Analyze metrics <span>→</span></button></div><div class="result-card accent-mint"><span class="result-label">YOUR BMI</span><strong id="bmiResult">—</strong><div class="bmi-meter"><i id="bmiMarker"></i></div><div class="result-sub" id="bmiCategory">Estimate, not a diagnosis</div></div></div><div class="metrics"><div><span>Healthy BMI</span><b>18.5 – 24.9</b></div><div><span>Ideal weight</span><b id="idealWeight">—</b></div><div><span>BMR</span><b id="bmr">—</b></div><div><span>Daily TDEE</span><b id="tdee">—</b></div><div><span>To healthy range</span><b id="healthyDiff">—</b></div></div><div class="info-card disclaimer">Health metrics are population-based estimates for education, not medical advice. Body composition and health conditions can change how these numbers apply.</div></section>
