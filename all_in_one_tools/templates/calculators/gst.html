<section class="tool-panel" data-panel="gst"><div class="panel-grid"><div class="input-card"><h3>GST invoice builder <span class="preset-row"><button data-gst="3">3%</button><button data-gst="5">5%</button><button data-gst="12">12%</button><button data-gst="18" class="selected">18%</button><button data-gst="28">28%</button></span></h3><div id="gstItems"></div><button class="outline-btn" id="addGstItem">+ Add item</button><div class="field-grid compact"><label>Discount before GST<input type="number" id="gstDiscount" value="0" min="0"></label><label>Tax mode<select id="gstMode"><option value="exclusive">Add GST (exclusive)</option><option value="inclusive">Remove GST (inclusive)</option></select></label></div><button class="primary-btn wide" id="gstCalculate">Calculate invoice <span>→</span></button></div><div class="result-card accent-sun"><span class="result-label">GRAND TOTAL</span><strong id="gstTotal">₹0.00</strong><div class="result-sub" id="gstTaxable">Taxable amount ₹0.00</div><button class="card-action" id="printInvoice">Print invoice</button></div></div><div class="breakup-card"><h3>GST breakup</h3><div class="breakup-grid"><p><span>CGST</span><b id="gstCgst">₹0.00</b></p><p><span>SGST</span><b id="gstSgst">₹0.00</b></p><p><span>IGST (interstate)</span><b id="gstIgst">₹0.00</b></p><p><span>Round-off</span><b id="gstRound">₹0.00</b></p></div><div class="invoice-table" id="gstTable"></div></div></section>
