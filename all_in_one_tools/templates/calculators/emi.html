<section class="tool-panel" data-panel="emi"><div class="panel-grid"><div class="input-card"><h3>Loan planner</h3><div class="field-grid"><label>Loan amount<input type="number" id="loanAmount" value="800000" min="0"></label><label>Annual interest %<input type="number" id="loanRate" value="10.5" step="0.01"></label><label>Tenure (years)<input type="number" id="loanYears" value="5" min="1"></label><label>Processing fee %<input type="number" id="loanFee" value="1" min="0"></label><label>Extra monthly payment<input type="number" id="loanExtra" value="0" min="0"></label><label>Start date<input type="date" id="loanStart"></label></div><button class="primary-btn wide" id="emiCalculate">Build repayment plan <span>→</span></button></div><div class="result-card accent-gold"><span class="result-label">MONTHLY EMI</span><strong id="emiResult">₹0</strong><div class="result-sub" id="emiPayment">Total payment ₹0</div></div></div><div class="metrics"><div><span>Principal</span><b id="emiPrincipal">—</b></div><div><span>Total interest</span><b id="emiInterest">—</b></div><div><span>Processing + GST</span><b id="emiFees">—</b></div><div><span>Interest saved</span><b id="emiSaved">—</b></div><div><span>Months saved</span><b id="emiMonthsSaved">—</b></div></div><div class="info-card"><div class="card-heading"><h3>Amortization schedule</h3><button class="outline-btn" id="downloadCsv">Download CSV</button></div><div class="schedule-wrap"><table><thead><tr><th>Month</th><th>EMI</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody id="emiSchedule"></tbody></table></div></div></section>
