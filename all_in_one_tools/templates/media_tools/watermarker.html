{% extends 'media_tools/base.html' %}{% block title %}Image Watermarker{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 05</div><h1>Image Watermarker</h1><p>Apply text or logo watermarks with opacity, rotation, and position controls.</p><div class="media-panel"><div class="media-grid"><div class="media-col-5"><div class="media-upload" data-input="watermarkFile"><i class="bi bi-droplet"></i><strong>Upload image</strong><input id="watermarkFile" type="file" accept="image/*"></div><div class="media-field"><label>Watermark text</label><input id="watermarkText" value="Thakronix"></div><div class="media-field"><label>Logo watermark</label><input id="watermarkLogo" type="file" accept="image/*"></div><div class="media-field"><label>Position</label><select id="watermarkPosition"><option>top-left</option><option>top-center</option><option>top-right</option><option>center</option><option>bottom-left</option><option>bottom-center</option><option selected>bottom-right</option></select></div><div class="media-field"><label>Opacity</label><input id="watermarkOpacity" type="range" min="10" max="100" value="55"></div><div class="media-field"><label>Rotation</label><input id="watermarkRotation" type="number" value="0"></div><button class="media-btn primary" id="watermarkRun">Apply watermark</button></div><div class="media-col-7"><div class="media-preview"><canvas id="watermarkCanvas"></canvas></div><button class="media-btn primary" id="watermarkDownload" disabled>Download PNG</button></div></div></div></section>{% endblock %}{% block scripts %}<script>let watermarkFile;mediaTools.setupUpload('watermarkFile',files=>watermarkFile=files[0]);document.getElementById('watermarkRun').onclick=async()=>{if(!watermarkFile)return alert('Upload an image first.');const image=await mediaTools.image(await mediaTools.read(watermarkFile)),canvas=document.getElementById('watermarkCanvas'),ctx=canvas.getContext('2d');canvas.width=image.width;canvas.height=image.height;ctx.drawImage(image,0,0);ctx.globalAlpha=+document.getElementById('watermarkOpacity').value/100;ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.font=`700 ${Math.max(24,canvas.width/20)}px DM Sans`;const text=document.getElementById('watermarkText').value,pos=document.getElementById('watermarkPosition').value,p=30;let x=p,y=canvas.height-p;ctx.textAlign=pos.includes('right')?'right':pos.includes('center')||pos==='center'?'center':'left';if(ctx.textAlign==='center')x=canvas.width/2;if(ctx.textAlign==='right')x=canvas.width-p;if(pos.includes('top'))y=70;ctx.save();ctx.translate(x,y);ctx.rotate(+document.getElementById('watermarkRotation').value*Math.PI/180);ctx.strokeText(text,0,0);ctx.fillText(text,0,0);ctx.restore();const button=document.getElementById('watermarkDownload');button.disabled=false;button.onclick=()=>mediaTools.download(canvas.toDataURL('image/png'),'watermarked.png')}</script>{% endblock %}
