{% extends 'media_tools/base.html' %}{% block title %}Passport Photo Maker{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 07</div><h1>Passport Photo Maker</h1><p>Create country presets and printable A4 photo sheets.</p><div class="media-panel"><div class="media-grid"><div class="media-col-5"><div class="media-upload" data-input="passportFile"><i class="bi bi-person-vcard"></i><strong>Upload portrait</strong><input id="passportFile" type="file" accept="image/*"></div><div class="media-field"><label>Preset</label><select id="passportSize"><option value="413,531">India passport 35 × 45 mm</option><option value="600,600">US passport 2 × 2 inch</option><option value="413,531">UK passport 35 × 45 mm</option><option value="400,500">Visa photo</option></select></div><div class="media-field"><label>Background</label><input id="passportBg" type="color" value="#ffffff"></div><div class="media-field"><label>Print count</label><select id="passportCount"><option>4</option><option selected>6</option><option>8</option><option>12</option></select></div><button class="media-btn primary" id="passportRun">Create sheet</button></div><div class="media-col-7"><div class="media-preview"><canvas id="passportCanvas"></canvas></div><button class="media-btn primary" id="passportDownload" disabled>Download print sheet</button></div></div></div></section>{% endblock %}{% block scripts %}<script>let passportFile;mediaTools.setupUpload('passportFile',files=>passportFile=files[0]);document.getElementById('passportRun').onclick=async()=>{if(!passportFile)return alert('Upload a portrait first.');const [w,h]=document.getElementById('passportSize').value.split(',').map(Number),count=+document.getElementById('passportCount').value,g=12,cols=3,rows=Math.ceil(count/cols),canvas=document.getElementById('passportCanvas');canvas.width=cols*w+(cols+1)*g;canvas.height=rows*h+(rows+1)*g;const ctx=canvas.getContext('2d');ctx.fillStyle=document.getElementById('passportBg').value;ctx.fillRect(0,0,canvas.width,canvas.height);const image=await mediaTools.image(await mediaTools.read(passportFile));for(let i=0;i<count;i++){const ratio=Math.max(w/image.width,h/image.height),x=g+(i%cols)*(w+g),y=g+Math.floor(i/cols)*(h+g);ctx.drawImage(image,x+(w-image.width*ratio)/2,y+(h-image.height*ratio)/2,image.width*ratio,image.height*ratio)}const button=document.getElementById('passportDownload');button.disabled=false;button.onclick=()=>mediaTools.download(canvas.toDataURL('image/png'),'passport-photo-sheet.png')}</script>{% endblock %}
