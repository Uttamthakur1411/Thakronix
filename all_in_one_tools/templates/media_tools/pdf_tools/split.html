{% extends 'media_tools/base.html' %}{% block title %}PDF Splitter{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>Split PDF</h1><p>Export a selected page range from a PDF.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-scissors"></i><strong>Upload PDF</strong><input id="file" type="file" accept="application/pdf"></div><div class="media-grid"><div class="media-col-6 media-field"><label>Start page</label><input id="start" type="number" value="1" min="1"></div><div class="media-col-6 media-field"><label>End page</label><input id="end" type="number" value="1" min="1"></div></div><div class="media-actions"><button class="media-btn primary" id="run">Split PDF</button><button class="media-btn light" onclick="location.reload()">Reset</button></div><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download split PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a PDF first.');const fd=new FormData();fd.append('pdf',file);fd.append('start_page',document.getElementById('start').value);fd.append('end_page',document.getElementById('end').value);const res=await fetch('/api/pdf-split',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Split failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='split.pdf';link.style.display='inline-flex';mediaTools.status('status','PDF split.')}</script>{% endblock %}
