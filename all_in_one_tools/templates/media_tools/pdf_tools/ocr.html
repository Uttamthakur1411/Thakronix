{% extends 'media_tools/base.html' %}{% block title %}Image OCR{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Document Tool</div><h1>Image → Text OCR</h1><p>Extract readable text from a scanned image.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-eye"></i><strong>Upload image</strong><input id="file" type="file" accept="image/*"></div><button class="media-btn primary" id="run">Run OCR</button><textarea id="output" rows="12" style="width:100%;margin-top:14px" placeholder="OCR text appears here"></textarea><div class="media-actions"><button class="media-btn light" id="copy">Copy text</button></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload an image first.');const fd=new FormData();fd.append('image',file);const res=await fetch('/api/ocr-image',{method:'POST',body:fd});const json=await res.json();if(!res.ok)return mediaTools.status('status',json.message||'OCR failed.');document.getElementById('output').value=json.text||'';mediaTools.status('status','OCR completed.')};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('output').value)</script>{% endblock %}
