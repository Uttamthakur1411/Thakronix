{% extends 'media_tools/base.html' %}{% block title %}PDF Merger{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>Merge PDFs</h1><p>Combine multiple PDF documents into one file.</p><div class="media-panel"><div class="media-upload" data-input="files"><i class="bi bi-files"></i><strong>Drop PDFs</strong><input id="files" type="file" accept="application/pdf" multiple></div><div class="media-preview" id="list">Select two or more PDF files.</div><div class="media-actions"><button class="media-btn primary" id="run">Merge PDFs</button><button class="media-btn light" onclick="location.reload()">Reset</button></div><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download merged PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let files=[];mediaTools.setupUpload('files',selected=>{files=selected;document.getElementById('list').innerHTML=files.map((f,i)=>`<div>${i+1}. ${f.name}</div>`).join('')});document.getElementById('run').onclick=async()=>{if(files.length<2)return mediaTools.status('status','Select at least two PDFs.');const fd=new FormData();files.forEach(file=>fd.append('pdfs',file));const res=await fetch('/api/pdf-merge',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Merge failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='merged.pdf';link.style.display='inline-flex';mediaTools.status('status','PDFs merged.')}</script>{% endblock %}
