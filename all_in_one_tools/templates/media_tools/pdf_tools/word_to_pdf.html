{% extends 'media_tools/base.html' %}{% block title %}Word to PDF{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Document Tool</div><h1>Word → PDF</h1><p>Convert a DOCX document into a PDF.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-filetype-doc"></i><strong>Upload DOCX</strong><input id="file" type="file" accept=".doc,.docx"></div><button class="media-btn primary" id="run">Convert to PDF</button><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a Word file first.');const fd=new FormData();fd.append('docx',file);const res=await fetch('/api/word-to-pdf',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Conversion failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='converted.pdf';link.style.display='inline-flex';mediaTools.status('status','Word document converted.')}</script>{% endblock %}
