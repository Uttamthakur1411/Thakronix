{% extends 'media_tools/base.html' %}{% block title %}PDF Compressor{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>Compress PDF</h1><p>Reduce PDF size with adjustable compression quality.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-arrows-angle-contract"></i><strong>Upload PDF</strong><input id="file" type="file" accept="application/pdf"></div><div class="media-field"><label>Quality</label><input id="quality" type="range" min="0.3" max="1" step="0.1" value="0.7"></div><div class="media-actions"><button class="media-btn primary" id="run">Compress PDF</button><button class="media-btn light" onclick="location.reload()">Reset</button></div><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download compressed PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a PDF first.');const fd=new FormData();fd.append('pdf',file);fd.append('quality',document.getElementById('quality').value);const res=await fetch('/api/pdf-compress',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Compression failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='compressed.pdf';link.style.display='inline-flex';mediaTools.status('status','PDF compressed.')}</script>{% endblock %}
