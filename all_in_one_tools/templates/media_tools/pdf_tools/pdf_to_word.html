{% extends 'media_tools/base.html' %}{% block title %}PDF to Word{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Document Tool</div><h1>PDF → Word</h1><p>Extract PDF text into an editable DOCX document.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-file-earmark-word"></i><strong>Upload PDF</strong><input id="file" type="file" accept="application/pdf"></div><button class="media-btn primary" id="run">Convert to Word</button><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download DOCX</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a PDF first.');const fd=new FormData();fd.append('pdf',file);const res=await fetch('/api/pdf-to-word',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Conversion failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='converted.docx';link.style.display='inline-flex';mediaTools.status('status','PDF converted to Word.')}</script>{% endblock %}
