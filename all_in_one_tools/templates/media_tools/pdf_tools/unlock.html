{% extends 'media_tools/base.html' %}{% block title %}PDF Unlock{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>Unlock PDF</h1><p>Save an accessible copy of a password-protected PDF.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-shield-lock"></i><strong>Upload PDF</strong><input id="file" type="file" accept="application/pdf"></div><div class="media-field"><label>Password</label><input id="password" type="password" placeholder="Optional password"></div><button class="media-btn primary" id="run">Unlock PDF</button><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download unlocked PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a PDF first.');const fd=new FormData();fd.append('pdf',file);fd.append('password',document.getElementById('password').value);const res=await fetch('/api/pdf-unlock',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Unlock failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='unlocked.pdf';link.style.display='inline-flex';mediaTools.status('status','PDF unlocked.')}</script>{% endblock %}
