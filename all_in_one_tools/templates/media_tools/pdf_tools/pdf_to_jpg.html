{% extends 'media_tools/base.html' %}{% block title %}PDF to JPG{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>PDF → JPG</h1><p>Convert the first PDF page into a downloadable JPG image.</p><div class="media-panel"><div class="media-upload" data-input="pdfFile"><i class="bi bi-file-earmark-pdf"></i><strong>Upload PDF</strong><input id="pdfFile" type="file" accept="application/pdf"></div><div class="media-actions"><button class="media-btn primary" id="run">Convert</button><button class="media-btn light" onclick="location.reload()">Reset</button></div><div class="media-preview" id="preview">Preview appears here.</div><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download JPG</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('pdfFile',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a PDF first.');const fd=new FormData();fd.append('pdf',file);const res=await fetch('/api/pdf-to-jpg',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Conversion failed.');const url=URL.createObjectURL(await res.blob());document.getElementById('preview').innerHTML=`<img src="${url}">`;const link=document.getElementById('download');link.href=url;link.download='converted.jpg';link.style.display='inline-flex';mediaTools.status('status','JPG created.')}</script>{% endblock %}
