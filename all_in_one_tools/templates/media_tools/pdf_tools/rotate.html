{% extends 'media_tools/base.html' %}{% block title %}PDF Rotator{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>Rotate PDF</h1><p>Rotate all PDF pages by 90-degree increments.</p><div class="media-panel"><div class="media-upload" data-input="file"><i class="bi bi-arrow-clockwise"></i><strong>Upload PDF</strong><input id="file" type="file" accept="application/pdf"></div><div class="media-field"><label>Angle</label><select id="angle"><option>90</option><option>180</option><option>270</option></select></div><button class="media-btn primary" id="run">Rotate PDF</button><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download rotated PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('file',files=>file=files[0]);document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload a PDF first.');const fd=new FormData();fd.append('pdf',file);fd.append('angle',document.getElementById('angle').value);const res=await fetch('/api/pdf-rotate',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Rotation failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='rotated.pdf';link.style.display='inline-flex';mediaTools.status('status','PDF rotated.')}</script>{% endblock %}
