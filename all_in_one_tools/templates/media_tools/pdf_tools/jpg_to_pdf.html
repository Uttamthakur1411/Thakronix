{% extends 'media_tools/base.html' %}{% block title %}JPG to PDF{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">PDF Tool</div><h1>Image → PDF</h1><p>Turn an image into a clean single-page PDF.</p><div class="media-panel"><div class="media-upload" data-input="imageFile"><i class="bi bi-image"></i><strong>Upload image</strong><input id="imageFile" type="file" accept="image/*"></div><div class="media-actions"><button class="media-btn primary" id="run">Create PDF</button><button class="media-btn light" onclick="location.reload()">Reset</button></div><div class="media-preview" id="preview">Preview appears here.</div><div class="media-actions"><a class="media-btn primary" id="download" style="display:none">Download PDF</a></div><div class="media-status" id="status"></div></div></section>{% endblock %}{% block scripts %}<script>let file;mediaTools.setupUpload('imageFile',files=>{file=files[0];document.getElementById('preview').innerHTML=`<img src="${URL.createObjectURL(file)}">`});document.getElementById('run').onclick=async()=>{if(!file)return mediaTools.status('status','Upload an image first.');const fd=new FormData();fd.append('image',file);const res=await fetch('/api/jpg-to-pdf',{method:'POST',body:fd});if(!res.ok)return mediaTools.status('status','Conversion failed.');const link=document.getElementById('download');link.href=URL.createObjectURL(await res.blob());link.download='image.pdf';link.style.display='inline-flex';mediaTools.status('status','PDF created.')}</script>{% endblock %}
