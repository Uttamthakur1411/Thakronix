{% extends 'media_tools/base.html' %}{% block title %}Text to Image{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 06</div><h1>Text to Image</h1><p>Create quote cards, social posts, stories, and landscape graphics.</p><div class="media-panel"><div class="media-grid"><div class="media-col-5"><div class="media-field"><label>Text</label><textarea id="textValue">Your quote goes here.</textarea></div><div class="media-field"><label>Canvas</label><select id="textCanvasSize"><option value="1080,1080">Square</option><option value="1080,1920">Portrait story</option><option value="1280,720">Landscape</option></select></div><div class="media-field"><label>Font</label><select id="textFont"><option>Space Grotesk</option><option>DM Sans</option><option>Georgia</option><option>cursive</option></select></div><div class="media-field"><label>Font size</label><input id="textSize" type="number" value="72"></div><div class="media-field"><label>Text color</label><input id="textColor" type="color" value="#ffffff"></div><div class="media-field"><label>Background</label><input id="textBg" type="color" value="#0f766e"></div><button class="media-btn primary" id="textRun">Render graphic</button></div><div class="media-col-7"><div class="media-preview"><canvas id="textCanvas" width="1080" height="1080"></canvas></div><button class="media-btn primary" id="textDownload" disabled>Download PNG</button></div></div></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('textRun').onclick=()=>{const [w,h]=document.getElementById('textCanvasSize').value.split(',').map(Number),c=document.getElementById('textCanvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle=document.getElementById('textBg').value;ctx.fillRect(0,0,w,h);ctx.fillStyle=document.getElementById('textColor').value;ctx.font=`700 ${document.getElementById('textSize').value}px ${document.getElementById('textFont').value}`;ctx.textAlign='center';ctx.textBaseline='middle';const text=document.getElementById('textValue').value;ctx.fillText(text,w/2,h/2,w*.8);const button=document.getElementById('textDownload');button.disabled=false;button.onclick=()=>mediaTools.download(c.toDataURL('image/png'),'text-image.png')}</script>{% endblock %}
