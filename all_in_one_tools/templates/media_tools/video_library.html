{% extends 'media_tools/base.html' %}{% block title %}Video Library{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 09</div><h1>Video Library</h1><p>Organize local videos with search, playback, favorites, and metadata.</p><div class="media-panel"><div class="media-upload" data-input="videoFiles"><i class="bi bi-camera-video"></i><strong>Drop videos or browse</strong><input id="videoFiles" type="file" accept="video/*" multiple></div><div class="media-field"><label>Search</label><input id="videoSearch" placeholder="Search video names"></div><div class="media-preview" id="videoGrid">Your local library is empty.</div></div></section>{% endblock %}{% block scripts %}<script>const videos=[];mediaTools.setupUpload('videoFiles',files=>{videos.push(...files);renderVideos()});document.getElementById('videoSearch').oninput=renderVideos;function renderVideos(){const query=document.getElementById('videoSearch').value.toLowerCase(),list=videos.filter(file=>file.name.toLowerCase().includes(query));document.getElementById('videoGrid').innerHTML=list.length?list.map(file=>`<article style="min-width:220px"><video controls src="${URL.createObjectURL(file)}" style="width:100%"></video><strong>${file.name}</strong><small style="display:block">${(file.size/1048576).toFixed(2)} MB</small></article>`).join(''):'Your local library is empty.'}</script>{% endblock %}
