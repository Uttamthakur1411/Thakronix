{% extends 'media_tools/base.html' %}{% block title %}Image URL Downloader{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 08</div><h1>Image URL Downloader</h1><p>Preview direct image URLs, inspect dimensions, and download where CORS permits.</p><div class="media-panel"><div class="media-field"><label>One URL per line</label><textarea id="imageUrls" placeholder="https://example.com/image.jpg"></textarea></div><div class="media-actions"><button class="media-btn primary" id="urlLoad">Load previews</button><button class="media-btn light" onclick="location.reload()">Reset</button></div><div class="media-preview" id="urlPreview">Previews will appear here.</div><div class="media-status" id="urlStatus"></div></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('urlLoad').onclick=()=>{const urls=document.getElementById('imageUrls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!urls.length)return mediaTools.status('urlStatus','Enter at least one URL.');document.getElementById('urlPreview').innerHTML=urls.map(url=>`<a href="${url}" target="_blank"><img src="${url}" alt="Remote image" style="max-width:31%;margin:1%"></a>`).join('');mediaTools.status('urlStatus',`${urls.length} preview(s) loaded. Use Open Image if a source blocks direct download.`)}</script>{% endblock %}
