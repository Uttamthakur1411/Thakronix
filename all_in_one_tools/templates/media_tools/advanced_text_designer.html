{% extends 'media_tools/base.html' %}{% block title %}Advanced Text Designer{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 11</div><h1>Advanced Text Designer</h1><p>Create social graphics with text layers, canvas presets, color, opacity, and export.</p><div class="media-panel"><div class="media-grid"><div class="media-col-4"><div class="media-field"><label>Main text</label><textarea id="designText">Consistency creates results.</textarea></div><div class="media-field"><label>Subtitle</label><input id="designSubtitle" value="Keep showing up."></div><div class="media-field"><label>Canvas</label><select id="designCanvasSize"><option value="1080,1080">Instagram post</option><option value="1080,1920">Instagram story</option><option value="1280,720">YouTube thumbnail</option><option value="1600,900">X post</option></select></div><div class="media-field"><label>Font</label><select id="designFont"><option>Space Grotesk</option><option>DM Sans</option><option>Georgia</option><option>cursive</option></select></div><div class="media-field"><label>Text color</label><input id="designColor" type="color" value="#ffffff"></div><div class="media-field"><label>Background</label><input id="designBg" type="color" value="#17202a"></div><div class="media-field"><label>Overlay opacity</label><input id="designOpacity" type="range" min="0" max="80" value="25"></div><div class="media-actions"><button class="media-btn primary" id="designRun">Render</button><button class="media-btn light" onclick="location.reload()">Reset</button></div></div><div class="media-col-8"><div class="media-preview"><canvas id="designCanvas" width="1080" height="1080"></canvas></div><button class="media-btn primary" id="designDownload" disabled>Download PNG</button></div></div></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('designRun').onclick=()=>{const [w,h]=document.getElementById('designCanvasSize').value.split(',').map(Number),canvas=document.getElementById('designCanvas'),ctx=canvas.getContext('2d');canvas.width=w;canvas.height=h;ctx.fillStyle=document.getElementById('designBg').value;ctx.fillRect(0,0,w,h);ctx.globalAlpha=+document.getElementById('designOpacity').value/100;ctx.fillStyle='#0f766e';ctx.fillRect(0,0,w,h);ctx.globalAlpha=1;ctx.fillStyle=document.getElementById('designColor').value;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.max(42,w/12)}px ${document.getElementById('designFont').value}`;ctx.fillText(document.getElementById('designText').value,w/2,h*.45,w*.8);ctx.font=`500 ${Math.max(22,w/28)}px ${document.getElementById('designFont').value}`;ctx.fillText(document.getElementById('designSubtitle').value,w/2,h*.62,w*.75);const button=document.getElementById('designDownload');button.disabled=false;button.onclick=()=>mediaTools.download(canvas.toDataURL('image/png'),'advanced-text-design.png')};document.getElementById('designRun').click()</script>{% endblock %}
