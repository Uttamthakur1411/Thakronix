{% extends 'media_tools/base.html' %}{% block title %}Profile Picture Maker{% endblock %}{% block content %}<section class="media-page"><div class="media-eyebrow">Tool 04</div><h1>Profile Picture Maker</h1><p>Make circle, square, or rounded profile images for social platforms.</p><div class="media-panel"><div class="media-grid"><div class="media-col-5"><div class="media-upload" data-input="profileFile"><i class="bi bi-person-circle"></i><strong>Upload photo</strong><input id="profileFile" type="file" accept="image/*"></div><div class="media-field"><label>Preset</label><select id="profileSize"><option value="1080">Instagram</option><option value="800">YouTube</option><option value="640">WhatsApp</option><option value="512">Discord</option><option value="400">LinkedIn</option></select></div><div class="media-field"><label>Frame</label><select id="profileFrame"><option>circle</option><option>rounded</option><option>square</option></select></div><div class="media-field"><label>Background</label><input id="profileBg" type="color" value="#dff5ef"></div><button class="media-btn primary" id="profileRun">Create profile</button></div><div class="media-col-7"><div class="media-preview"><canvas id="profileCanvas" width="800" height="800"></canvas></div><button class="media-btn primary" id="profileDownload" disabled>Download PNG</button></div></div></div></section>{% endblock %}{% block scripts %}<script>let profileFile;mediaTools.setupUpload('profileFile',files=>profileFile=files[0]);document.getElementById('profileRun').onclick=async()=>{if(!profileFile)return alert('Upload a photo first.');const size=+document.getElementById('profileSize').value,c=document.getElementById('profileCanvas'),ctx=c.getContext('2d');c.width=c.height=size;ctx.fillStyle=document.getElementById('profileBg').value;ctx.fillRect(0,0,size,size);const image=await mediaTools.image(await mediaTools.read(profileFile));ctx.save();const frame=document.getElementById('profileFrame').value;if(frame==='circle'){ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip()}else if(frame==='rounded'){ctx.beginPath();ctx.roundRect(0,0,size,size,size*.12);ctx.clip()}const ratio=Math.max(size/image.width,size/image.height);ctx.drawImage(image,(size-image.width*ratio)/2,(size-image.height*ratio)/2,image.width*ratio,image.height*ratio);ctx.restore();const button=document.getElementById('profileDownload');button.disabled=false;button.onclick=()=>mediaTools.download(c.toDataURL('image/png'),'profile-picture.png')}</script>{% endblock %}
